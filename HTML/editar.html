<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Remix Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css"
    />

    <!--==================== Favicon====================-->
    <link rel="shortcut icon" href="../img/favicon.ico" type="image/x-icon" />

    <!-- CSS do editar -->
    <link rel="stylesheet" href="../CSS/editar.css" />

    

    <title>TechFix - Editar Perfil</title>
  </head>
  <body>
    <main>
      <section class="editar">
        <h1>Editar Perfil</h1>
        <form id="form-editar">
          <label>Foto de Perfil:</label>
          <input type="file" id="avatar" accept="image/*" />
          <img
            id="preview"
            src="../img/Perfis/Default perfil.jpg"
            alt="Preview do avatar"
          />

          <label>Nome:</label>
          <input
            type="text"
            id="nome"
            required
            placeholder="Ex: Pedro Henrique Giovanelli"
          />

          <label>Pronomes:</label>
          <input type="text" id="pronome" placeholder="Ex: Ele/Dele" />

          <label>Profissão:</label>
          <input type="text" id="profissao" placeholder="Ex: Cliente ou Técnico em informática" />

          <label>Localização:</label>
          <input type="text" id="local" placeholder="Ex: São Paulo-SP" />

          <label>E-mail:</label>
          <input type="email" id="email" placeholder="E-mail profissional:" />

          <label>Número:</label>
          <input
            type="tel"
            id="telefone"
            placeholder="Ex: (11) 9999-9999"
          />

          <label>Biografia:</label>
          <textarea
            id="biografia"
            maxlength="500"
            placeholder="Resumo profissional ou pessoal (máx. 500 caracteres)"
          ></textarea>

          <label>Educação:</label>
          <textarea
            id="educacao"
            maxlength="500"
            placeholder="Ex: University of São Paulo - Administration (max. 500 characters)"
          ></textarea>

          <div class="botoes">
            <button type="submit" class="salvar">
              <i class="ri-check-line"></i> Salvar
            </button>
            <button
              type="button"
              class="cancelar"
              onclick="window.location.href='perfil.html'"
            >
              <i class="ri-close-line"></i> Cancelar
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="../JS/editar.js" defer></script>
  </body>
</html>
